services:
  enset-ebank-discovery-service:
    build: ./discovery-service
    container_name: enset-bank-discovery-service
    ports:
      - '8761:8761'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on: {}

  enset-ebank-config-service:
    build: ./config-service
    container_name: enset-ebank-config-service
    ports:
      - '9999:9999'
    environment:
      - DISCOVERY_SERVICE_URL=http://enset-ebank-discovery-service:8761/eureka
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9999/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      enset-ebank-discovery-service:
        condition: service_healthy

  enset-customer-service:
    build: ./customer-service
    container_name: enset-customer-service
    ports:
      - '8081:8081'
    environment:
      - DISCOVERY_SERVICE_URL=http://enset-ebank-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://enset-ebank-config-service:9999
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      enset-ebank-discovery-service:
        condition: service_healthy
      enset-ebank-config-service:
        condition: service_healthy

  enset-account-service:
    build: ./account-service
    container_name: enset-account-service
    ports:
      - '8082:8082'
    environment:
      - DISCOVERY_SERVICE_URL=http://enset-ebank-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://enset-ebank-config-service:9999
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      enset-ebank-config-service:
        condition: service_healthy
      enset-customer-service:
        condition: service_healthy

  enset-gateway-service:
    build: ./gateway-service
    container_name: enset-gateway-service
    ports:
      - '8888:8888'
    environment:
      - DISCOVERY_SERVICE_URL=http://enset-ebank-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://enset-ebank-config-service:9999
    depends_on:
      enset-ebank-config-service:
        condition: service_healthy
      enset-account-service:
        condition: service_healthy